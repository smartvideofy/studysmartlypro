    <meta name="theme-color" content="hsl(285, 78%, 65%)" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta name="format-detection" content="telephone=no" />

    <!-- iOS Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="description" content="Getstudily is your AI-powered study companion. Create flashcards, organize notes, and master any subject with smart learning tools." />

    <meta property="og:title" content="Getstudily - Study Smarter, Not Harder" />

  <body>
    <!-- Shown instantly while the app's code downloads (React replaces it on first render). -->
    <style>
      #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#f3e8f7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#4a2a5a}
      #boot img{width:56px;height:56px;border-radius:14px;box-shadow:0 6px 20px rgba(147,51,234,.25)}
      #boot p{margin:0;font-size:15px;font-weight:600;letter-spacing:.2px}
      #boot i{display:block;width:120px;height:4px;border-radius:4px;background:rgba(147,51,234,.15);overflow:hidden;position:relative}
      #boot i:after{content:"";position:absolute;inset:0;width:40%;border-radius:4px;background:#9333ea;animation:boot 1.1s ease-in-out infinite}
      @keyframes boot{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
      @media (prefers-color-scheme:dark){#boot{background:#1d1422;color:#ead9f2}}
    </style>
    <div id="root"><div id="boot" role="status" aria-label="Loading Studily"><img src="/favicon.png" alt="" /><p>Getstudily</p><i></i></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
